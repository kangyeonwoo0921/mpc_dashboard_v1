    value: 0.00015
    units: m
    source_type: operator_report
    source_id: operator report 2026-10-07 (0.15 mm)
    status: provisional
    verified: false
    notes: candidate h_roof for Eq. 8.19 once the cover layer mapping and conductivity are known

heating:
