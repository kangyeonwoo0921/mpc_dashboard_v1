    value: hot_water_boiler
    source_type: operator_report
    source_id: operator report 2026-10-07
    status: provisional
    verified: false
    notes: heat distribution (pipes vs. fan coil) not reported; decides H_PipeAir vs H_BlowAir (Q-9)

thermal:
  C_eff:   {value: null, units: J/K, source_type: unknown, status: unknown, verified: false}
