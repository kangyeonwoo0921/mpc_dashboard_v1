    units: deg
    source_type: operator_report
    source_id: user lookup (dashboard config/site.json)
    status: provisional
    verified: false
  longitude:
    value: 126.709
    units: deg
    source_type: operator_report
    source_id: user lookup (dashboard config/site.json)
    status: provisional
    verified: false
  elevation:
    value: 3.0
    units: m
    source_type: operator_report
    source_id: user lookup (dashboard config/site.json)
    status: provisional
    verified: false
  ridge_azimuth_true_north:
    value: 104.0
    units: deg
    source_type: operator_report
    source_id: compass measurement (X1 entrance at east end)
    status: provisional
    verified: false
  timezone:
    value: Asia/Seoul
    source_type: operator_report
    status: provisional
    verified: false
  air_pressure:
    value: null
    units: Pa
    source_type: unknown
    status: unknown
    verified: false
