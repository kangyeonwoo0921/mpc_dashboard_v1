  delta_shade:
    value: null
    source_type: greenhouse_physics_literature
    source_id: SRC-BAILEY1988 (38 % / 60 % sensitivity only)
    status: unknown
    verified: false
    notes: stop item
  delta_diffuse: {value: null, source_type: unknown, status: unknown, verified: false, notes: A-6 / OD-2}
  eta_solar: {value: null, source_type: unknown, status: unknown, verified: false, notes: G-5}

radiation:
  sensor_quantity:
    value: global_shortwave
    source_type: operator_report
    source_id: OD-4 (2026-10-04)
    status: provisional
    verified: false
  sensor_location:
    value: above_cover_outside
    source_type: operator_report
    source_id: operator report 2026-10-07 (S01 rear end, mounted above the cover); supersedes OD-4 "screen level"
    status: provisional
    verified: false
    notes: outside global radiation; exact mounting point and height not surveyed
  # Physics inputs (equation baseline §14, §17, §21). Activate only with manufacturer specs or
  # field measurements; no generic transmittance is inserted (user decision 2026-10-06).
  shade_screen_optics:                 # Vanthoor Eq. 8.16 / 8.17 (and 8.39 / 8.41 if thermal role)
    tau_PAR: {value: null, source_type: unknown, status: field_required, verified: false, notes: manufacturer_or_measurement}
    rho_PAR: {value: null, source_type: unknown, status: field_required, verified: false, notes: manufacturer_or_measurement}
    tau_NIR: {value: null, source_type: unknown, status: field_required, verified: false, notes: manufacturer_or_measurement}
    rho_NIR: {value: null, source_type: unknown, status: field_required, verified: false, notes: manufacturer_or_measurement}
    tau_FIR: {value: null, source_type: unknown, status: field_required, verified: false, notes: only if used as thermal screen}
  diffuse_screen_optics:               # Cabrera (2009) Eq. 6-8 coefficients
    tau_bb: {value: null, source_type: unknown, status: field_required, verified: false, notes: manufacturer_or_measurement}
    tau_bd: {value: null, source_type: unknown, status: field_required, verified: false, notes: manufacturer_or_measurement}
    tau_d:  {value: null, source_type: unknown, status: field_required, verified: false, notes: manufacturer_or_measurement}
    partial_opening_relation: {value: null, source_type: unknown, status: unknown, verified: false, notes: DIFF-OPEN unresolved; do not invent}

# Provisional / unverified metadata. NOT used by any physics calculation (user decision 2026-10-06).
# Kept for reference until manufacturer specifications or field measurements replace them.
unverified_reference_values:
  cover_direct_transmittance:
    value: 0.85
    source_type: operator_report
    source_id: dashboard config/radiation_v1 (2026-09-30), PO film, basis unstated
    status: provisional
    verified: false
    notes: unverified; no cover-transmittance term in the equation baseline
  shade_screen_transmittance:
    value: 0.30
    source_type: operator_report
    source_id: operator report 2026-10-07 (차광커튼2, aluminium, 70 % shading; replaces 0.25 from 75 %)
    status: provisional
    verified: false
    notes: unverified; waveband and measurement basis unknown; not for physics
  diffuse_screen_transmittance:
    value: 0.90
    source_type: operator_report
    source_id: operator report 2026-10-07 (차광커튼1, 'Ultra', 10 % shading; replaces 0.80 from 20 %)
    status: provisional
    verified: false
    notes: unverified; direct/diffuse basis unknown; not for physics

